<title>Rubro-Negro: Corrida ao Maraca</title>
<style>
  :root{--red:#d71920;--dark:#101114;--gold:#ffd54a;--white:#fff;--panel:rgba(10,10,12,.88)}
  *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#750008;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  body{display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#df1f2d 0,#85000a 45%,#1d0507 100%)}
  #wrap{position:relative;width:min(100vw,1100px);height:min(100vh,680px);aspect-ratio:16/10;background:#111;overflow:hidden;box-shadow:0 20px 70px #000a;border:2px solid #ff5960}
  canvas{display:block;width:100%;height:100%;image-rendering:auto}
  #hud{position:absolute;inset:12px 12px auto;display:flex;justify-content:space-between;gap:10px;pointer-events:none;font-weight:900;text-shadow:0 2px 3px #000}
  .pill{background:var(--panel);border:1px solid #ffffff30;border-radius:999px;padding:8px 13px;backdrop-filter:blur(5px)}
  #overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#08090bbd,#08090be8);padding:24px;text-align:center}
  #card{max-width:560px;background:#111e;border:1px solid #fff3;border-radius:24px;padding:25px;box-shadow:0 20px 55px #0009}
  #crest{width:96px;height:96px;object-fit:cover;border-radius:18px;border:3px solid #fff;margin-bottom:8px}
  h1{margin:4px 0 8px;font-size:clamp(28px,6vw,52px);color:#fff} p{line-height:1.45;color:#eee}
  button{border:0;border-radius:14px;background:linear-gradient(#f32c36,#b80610);color:#fff;font-weight:900;padding:13px 22px;font-size:17px;cursor:pointer;box-shadow:0 6px 0 #650006}
  button:active{transform:translateY(4px);box-shadow:0 2px 0 #650006}
  #mobile{position:absolute;inset:auto 14px 14px;display:none;justify-content:space-between;align-items:end;pointer-events:none}
  .group{display:flex;gap:10px}.ctl{pointer-events:auto;width:64px;height:64px;padding:0;border-radius:50%;font-size:27px;opacity:.86;touch-action:none;user-select:none}
  .jump{width:82px;height:82px;background:linear-gradient(#ffd95d,#e49b00);color:#3a2100;box-shadow:0 6px 0 #8b5d00}
  #hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#0009;padding:7px 12px;border-radius:10px;font-size:13px;white-space:nowrap;pointer-events:none}
  @media (hover:none),(max-width:760px){#mobile{display:flex}#hint{display:none}#hud{font-size:13px}.pill{padding:6px 9px}}
</style>

<script>
(()=>{
'use strict';
const c=document.querySelector('#game'),ctx=c.getContext('2d');
const overlay=document.querySelector('#overlay'),title=document.querySelector('#title'),message=document.querySelector('#message'),startBtn=document.querySelector('#start');
const scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),timeEl=document.querySelector('#time');
const crest=new Image(); crest.src=document.querySelector('#crest').src;
const W=c.width,H=c.height, WORLD=3300, G=0.72;
const keys={left:false,right:false,jump:false}; let running=false,last=0,camera=0,startTime=0,elapsed=0;
let player,platforms,balls,enemies,particles;
function reset(){
 player={x:80,y:420,w:38,h:50,vx:0,vy:0,on:false,face:1,lives:3,score:0,inv:0};
 platforms=[
  {x:0,y:530,w:520,h:70},{x:610,y:520,w:480,h:80},{x:1180,y:535,w:370,h:65},{x:1640,y:505,w:520,h:95},{x:2250,y:535,w:470,h:65},{x:2800,y:500,w:500,h:100},
  {x:250,y:420,w:150,h:22},{x:690,y:390,w:150,h:22},{x:900,y:310,w:120,h:22},{x:1250,y:410,w:130,h:22},{x:1460,y:330,w:120,h:22},
  {x:1760,y:380,w:150,h:22},{x:1990,y:290,w:130,h:22},{x:2360,y:400,w:140,h:22},{x:2600,y:315,w:120,h:22},{x:2900,y:370,w:140,h:22}
 ];
 balls=[[315,380],[742,350],[945,270],[1305,370],[1518,290],[1825,340],[2425,360],[2660,275]].map((p,i)=>({x:p[0],y:p[1],r:13,t:i*.7,got:false}));
 enemies=[{x:760,y:480,a:650,b:1030,v:1.6},{x:1300,y:495,a:1190,b:1510,v:1.8},{x:1860,y:465,a:1650,b:2120,v:2.0},{x:2440,y:495,a:2260,b:2690,v:1.7}];
 particles=[]; camera=0;startTime=performance.now();elapsed=0; updateHud();
}
function updateHud(){scoreEl.textContent=player.score;livesEl.textContent=player.lives;timeEl.textContent=Math.floor(elapsed)}
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function burst(x,y,color){for(let i=0;i<16;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:-Math.random()*6,a:1,color})}
function lose(){if(player.inv>0)return;player.lives--;player.inv=110;burst(player.x+19,player.y+25,'#ff3344');if(player.lives<=0){finish(false);return}player.x=Math.max(60,camera+70);player.y=350;player.vx=0;player.vy=-4;updateHud()}
function finish(win){running=false;title.textContent=win?'Mengão no estádio!':'Fim de jogo';message.textContent=win?`Você coletou ${player.score} bolas em ${Math.floor(elapsed)} segundos. O Maraca está em festa!`:'Os adversários venceram esta rodada. Tente novamente e chegue ao estádio.';startBtn.textContent='Jogar novamente';overlay.style.display='grid'}
function update(dt){
 elapsed=(performance.now()-startTime)/1000;
 const accel=.72,max=6.2;if(keys.left){player.vx-=accel;player.face=-1}if(keys.right){player.vx+=accel;player.face=1}if(!keys.left&&!keys.right)player.vx*=.78;player.vx=Math.max(-max,Math.min(max,player.vx));
 if(keys.jump&&player.on){player.vy=-13.5;player.on=false;keys.jump=false}
 player.vy+=G;player.vy=Math.min(16,player.vy);player.x+=player.vx;player.x=Math.max(0,Math.min(WORLD-player.w,player.x));
 player.y+=player.vy;player.on=false;
 for(const p of platforms){if(player.vy>=0&&player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h-player.vy<=p.y+5){player.y=p.y-player.h;player.vy=0;player.on=true}}
 if(player.y>H+120)lose();
 if(player.inv>0)player.inv--;
 balls.forEach(b=>{b.t+=.06;if(!b.got){const dx=player.x+player.w/2-b.x,dy=player.y+player.h/2-(b.y+Math.sin(b.t)*6);if(dx*dx+dy*dy<900){b.got=true;player.score++;burst(b.x,b.y,'#ffd43b');updateHud()}}});
 enemies.forEach(e=>{e.x+=e.v;if(e.x<e.a||e.x>e.b)e.v*=-1;const box={x:e.x,y:e.y,w:42,h:38};if(rectHit(player,box)){if(player.vy>3&&player.y+player.h<e.y+19){e.x=-9999;player.vy=-9;burst(box.x+20,box.y,'#fff')}else lose()}});
 particles.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.25;q.a-=.025});particles=particles.filter(q=>q.a>0);
 camera+=(Math.max(0,Math.min(WORLD-W,player.x-W*.35))-camera)*.09;
 if(player.x>3150){if(player.score===8)finish(true);else{player.x=3040;player.vx=-5}}
 updateHud();
}
function sky(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#61b9ff');g.addColorStop(.66,'#c9efff');g.addColorStop(1,'#fff2cf');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#ffffffaa';for(let i=0;i<8;i++){let x=(i*220-camera*.18)%1200-100,y=90+(i%3)*55;ctx.beginPath();ctx.arc(x,y,30,0,7);ctx.arc(x+35,y-8,40,0,7);ctx.arc(x+75,y,28,0,7);ctx.fill()}
 ctx.fillStyle='#284e72';for(let i=0;i<18;i++){let x=i*210-camera*.35;ctx.beginPath();ctx.moveTo(x,H-70);ctx.lineTo(x+100,H-250-(i%4)*20);ctx.lineTo(x+220,H-70);ctx.fill()}
}
function draw(){
 sky();ctx.save();ctx.translate(-camera,0);
 // cidade ao fundo
 for(let x=100;x<WORLD;x+=190){ctx.fillStyle=x%380?'#efd9bd':'#e7c4a2';ctx.fillRect(x,360,145,170);ctx.fillStyle='#8cc6df';for(let r=0;r<3;r++)for(let k=0;k<3;k++)ctx.fillRect(x+18+k*40,380+r*42,20,24)}
 // plataformas
 platforms.forEach(p=>{ctx.fillStyle='#151515';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#d71920';ctx.fillRect(p.x,p.y,p.w,13);ctx.fillStyle='#ffffff18';ctx.fillRect(p.x,p.y+13,p.w,5)});
 // bolas
 balls.forEach(b=>{if(b.got)return;const y=b.y+Math.sin(b.t)*6;ctx.save();ctx.translate(b.x,y);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,b.r,0,7);ctx.fill();ctx.fillStyle='#111';for(let i=0;i<5;i++){const a=i*Math.PI*2/5;ctx.beginPath();ctx.arc(Math.cos(a)*7,Math.sin(a)*7,3,0,7);ctx.fill()}ctx.restore()});
 // adversários originais
 enemies.forEach(e=>{if(e.x<0)return;ctx.fillStyle='#1c55b8';ctx.fillRect(e.x,e.y,42,38);ctx.fillStyle='#fff';ctx.fillRect(e.x,e.y+10,42,8);ctx.fillStyle='#111';ctx.fillRect(e.x+5,e.y+31,10,9);ctx.fillRect(e.x+27,e.y+31,10,9);ctx.fillStyle='#fff';ctx.fillRect(e.x+8,e.y+5,7,7);ctx.fillRect(e.x+27,e.y+5,7,7)});
 // estádio/meta
 ctx.fillStyle='#e7e8ea';ctx.fillRect(3150,260,145,240);ctx.fillStyle='#111';ctx.fillRect(3165,330,115,170);ctx.fillStyle='#d71920';ctx.fillRect(3130,250,185,30);ctx.font='900 24px system-ui';ctx.fillStyle='#fff';ctx.fillText('MARACA',3162,274);if(crest.complete)ctx.drawImage(crest,3186,285,70,55);
 // jogador
 if(player.inv%12<6){ctx.save();ctx.translate(player.x+player.w/2,player.y+player.h/2);ctx.scale(player.face,1);ctx.fillStyle='#111';ctx.fillRect(-17,-4,34,30);ctx.fillStyle='#d71920';ctx.fillRect(-17,-4,34,8);ctx.fillRect(-17,12,34,8);ctx.fillStyle='#f1bb87';ctx.beginPath();ctx.arc(0,-15,13,0,7);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(-14,-27,28,8);ctx.fillStyle='#fff';ctx.fillRect(8,-17,3,3);ctx.fillStyle='#111';ctx.fillRect(-15,26,12,10);ctx.fillRect(5,26,12,10);ctx.restore()}
 particles.forEach(q=>{ctx.globalAlpha=q.a;ctx.fillStyle=q.color;ctx.fillRect(q.x,q.y,5,5);ctx.globalAlpha=1});ctx.restore();
 // bloqueio da meta sem bolas
 if(player.x>2970&&player.score<8){ctx.fillStyle='#000b';ctx.fillRect(300,80,360,55);ctx.fillStyle='#fff';ctx.font='800 18px system-ui';ctx.textAlign='center';ctx.fillText(`Faltam ${8-player.score} bolas para entrar no estádio`,480,114);ctx.textAlign='left'}
}
function loop(t){if(!running)return;const dt=Math.min(2,(t-last)/16.67||1);last=t;update(dt);draw();requestAnimationFrame(loop)}
function setKey(code,v){if(['ArrowLeft','KeyA'].includes(code))keys.left=v;if(['ArrowRight','KeyD'].includes(code))keys.right=v;if(['ArrowUp','KeyW','Space'].includes(code)){if(v)keys.jump=true;else keys.jump=false}}
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyR'){reset();running=true;overlay.style.display='none';requestAnimationFrame(loop)}setKey(e.code,true)});
addEventListener('keyup',e=>setKey(e.code,false));
document.querySelectorAll('.ctl').forEach(b=>{const k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true},off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});
startBtn.addEventListener('click',()=>{reset();overlay.style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)});
reset();draw();
})();
</script>
</body>
</html>
